[package]
name = "rustboy-rom-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ROM conformance runner for Rustboy."
license.workspace = true

[[bin]]
name = "rustboy-rom-tests"
path = "src/main.rs"

[dependencies]
libtest-mimic = "0.8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustboy-core = { path = "../rustboy-core" }
rustboy-application = { path = "../rustboy-application" }
rustboy-adapter-rom = { path = "../rustboy-adapter-rom" }
